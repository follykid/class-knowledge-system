<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>504 班級榮譽榜</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#11151b;color:#fff}
body{overflow:hidden}.board-wrap{height:100vh;padding:18px 26px;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -10%,#3a414d 0,#1c222b 38%,#0e1217 100%)}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex:0 0 auto}.title{font-size:clamp(28px,2.7vw,46px);font-weight:1000;letter-spacing:1px}.sub{color:#aeb7c3;font-size:15px;margin-top:2px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#303944;color:#fff;font-weight:900;cursor:pointer}.btn.active{background:#ffc928;color:#16191d}.btn:hover{filter:brightness(1.1)}
.tabs{display:flex;gap:8px;margin:12px 0 10px;flex:0 0 auto}.tab{border:1px solid #4a5360;background:#202731;color:#dfe5eb;border-radius:12px;padding:8px 16px;font-weight:900;cursor:pointer}.tab.active{background:#ffd13b;color:#17191d;border-color:#ffd13b;box-shadow:0 4px 14px #ffd13b33}
.status{text-align:right;color:#87919e;font-size:12px;height:18px;flex:0 0 auto}
.grid{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;grid-auto-rows:minmax(0,1fr);gap:9px;flex:1;min-height:0;overflow:hidden}
.card{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid #3b434e;border-radius:16px;padding:9px;background:linear-gradient(145deg,#252b34,#181d24);box-shadow:0 5px 18px #0007;display:grid;grid-template-columns:42px 54px minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:8px;align-items:center}
.card.top1{border:2px solid #ffd43b;background:linear-gradient(145deg,#3a321d,#1b1f25)}.card.top2{border-color:#d9e0e7}.card.top3{border-color:#c98f55}
.rank{font-size:20px;font-weight:1000;text-align:center;align-self:start;padding-top:3px}.ranknum{font-size:16px;color:#aab3be}.avatar{width:54px!important;height:54px!important;min-width:54px!important;max-width:54px!important;min-height:54px!important;max-height:54px!important;border-radius:50%;object-fit:cover;display:block;border:3px solid #697481!important;grid-row:1/3}.top1 .avatar{border-color:#ffd43b!important}.info{min-width:0}.seat{font-size:11px;color:#89939f}.name{font-size:17px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bigscore{font-size:clamp(28px,2.2vw,42px);font-weight:1000;line-height:1;white-space:nowrap;color:#ffd43b}.bigscore small{font-size:12px;color:#aeb7c3;margin-left:2px}.stats{grid-column:2/4;font-size:11px;color:#aeb7c3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.prizes{grid-column:1/4;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;overflow:hidden;max-height:31px;margin-top:2px}.prize{font-size:10px;line-height:1;padding:5px 7px;border-radius:999px;background:linear-gradient(90deg,#503e09,#332a10);border:1px solid #9f7d20;color:#ffe27a;font-weight:900;white-space:nowrap}.empty{font-size:10px;color:#68727f}
.battle-score{color:#7dd3fc}.win{color:#7ee787}.loss{color:#ff8f8f}
@media(max-width:1400px){.board-wrap{padding:14px 18px}.card{grid-template-columns:34px 46px minmax(0,1fr);padding:7px;gap:6px}.avatar{width:46px!important;height:46px!important;min-width:46px!important;max-width:46px!important;min-height:46px!important;max-height:46px!important}.name{font-size:15px}.bigscore{font-size:30px}}
@media(max-width:1000px){body{overflow:auto}.board-wrap{height:auto;min-height:100vh}.grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-auto-rows:120px}.status{height:auto}.actions{flex-wrap:wrap}}
</style></head>
<body>
<div class="board-wrap">
<header class="board-head"><div><div class="title" id="title">🏆 504 班級積分排名</div><div class="sub" id="subtitle">全班積分 × 寶物卡</div></div><div class="actions"><button class="btn" onclick="location.href='/display/toothbrush'">🪥 潔牙</button><button class="btn" onclick="document.documentElement.requestFullscreen?.()">⛶ 全螢幕</button></div></header>
<div class="tabs"><button id="scoreTab" class="tab active" onclick="setMode('score')">🏆 班級積分排名</button><button id="battleTab" class="tab" onclick="setMode('battle')">⚔️ 學生戰績排名</button></div>
<div id="status" class="status">資料載入中…</div><main id="board" class="grid"></main>
</div>
<script>
const board=document.getElementById('board'),statusEl=document.getElementById('status');let mode='score';let latest=[];
function avatar(x){const file=x.account==='teacher01'?'teacher.jpg':`${String(x.seat).padStart(2,'0')}.jpg`;return `/static/avatars/${file}`}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function setMode(m){mode=m;document.getElementById('scoreTab').classList.toggle('active',m==='score');document.getElementById('battleTab').classList.toggle('active',m==='battle');render()}
function render(){
 let items=[...latest];
 if(mode==='score') items.sort((a,b)=>b.score-a.score||a.seat-b.seat); else items.sort((a,b)=>b.wins-a.wins||a.losses-b.losses||b.battle_score-a.battle_score||a.seat-b.seat);
 document.getElementById('title').textContent=mode==='score'?'🏆 504 班級積分排名':'⚔️ 504 學生戰績排名';
 document.getElementById('subtitle').textContent=mode==='score'?'全班積分 × 寶物卡':'對戰勝敗 × 戰力 × 班級積分';
 board.innerHTML=items.map((x,i)=>{
   const rank=i+1, medal=rank<=3?['🥇','🥈','🥉'][rank-1]:`<span class="ranknum">${rank}</span>`;
   const prizes=(x.cards||[]).slice(0,4).map(p=>`<span class="prize">🎁 ${esc(p.name)}</span>`).join('')||'<span class="empty">尚無寶物卡</span>';
   const main=mode==='score'?`<div class="bigscore">${x.score}<small>分</small></div>`:`<div class="bigscore battle-score">${x.battle_score}<small>戰力</small></div>`;
   const stats=mode==='score'?`戰績 ${x.wins} 勝 ${x.losses} 敗　｜　HP ${x.hp}`:`<span class="win">勝 ${x.wins}</span>　<span class="loss">敗 ${x.losses}</span>　｜　積分 ${x.score} 分`;
   return `<article class="card ${rank<=3?'top'+rank:''}"><div class="rank">${medal}</div><img class="avatar" src="${avatar(x)}" onerror="this.style.display='none'"><div class="info"><div class="seat">${String(x.seat).padStart(2,'0')} 號</div><div class="name">${esc(x.name)}</div>${main}</div><div class="stats">${stats}</div><div class="prizes">${prizes}</div></article>`;
 }).join('');
}
async function load(){try{const r=await fetch('/api/display/leaderboard?mode='+mode,{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'載入失敗');latest=d.items||[];statusEl.textContent='每 5 秒自動更新　｜　共 '+latest.length+' 位學生';render()}catch(e){statusEl.textContent='正在等待系統資料…'}}
load();setInterval(load,5000);
</script></body></html>
