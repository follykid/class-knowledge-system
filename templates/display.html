<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班級榮譽榜</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap"><div class="card"><div class="top"><div class="brand">🏆 班級榮譽榜</div><div class="muted">知識王積分系統 v1</div></div><div id="board"></div></div></div><script>async function load(){let d=await fetch('/api/leaderboard').then(r=>r.json());document.getElementById('board').innerHTML='<table class="leader"><tr><th>#</th><th>座號</th><th>姓名</th><th>積分</th><th>勝</th><th>負</th></tr>'+d.items.map(x=>`<tr class="${x.rank<=3?'rank1':''}"><td>${x.rank}</td><td>${String(x.seat).padStart(2,'0')}</td><td>${x.name}</td><td>${x.score}</td><td>${x.wins}</td><td>${x.losses}</td></tr>`).join('')+'</table>'}load();setInterval(load,5000)</script></body></html>
