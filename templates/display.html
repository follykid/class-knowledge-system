<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班級積分排名</title><link rel="stylesheet" href="/static/style.css"></head><body class="display-page display-score-page"><div class="display-wrap"><header class="display-header"><div><div class="display-title">🏆 504 班積分排名</div><div class="display-subtitle">即時更新・每列 6 人</div></div><div class="display-actions"><button class="display-nav" onclick="location.href='/display/toothbrush'">🪥 潔牙</button><button class="display-full" onclick="document.documentElement.requestFullscreen?.()">⛶ 全螢幕</button></div></header><div id="status" class="display-status">資料載入中…</div><main id="board" class="display-score-grid"></main></div><script>
const board=document.getElementById('board'),statusEl=document.getElementById('status');
function avatar(x){return `/static/avatars/${x.account==='teacher01'?'teacher.jpg':String(x.seat).padStart(2,'0')+'.jpg'}`}
async function load(){try{const r=await fetch('/api/display/leaderboard',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'載入失敗');statusEl.textContent='每 5 秒自動更新';board.innerHTML=d.items.map(x=>`<article class="score-card rank-${Math.min(x.rank,4)}"><div class="score-rank">${x.rank<=3?['🥇','🥈','🥉'][x.rank-1]:x.rank}</div><img class="score-avatar" src="${avatar(x)}" onerror="this.style.visibility='hidden'"><div class="score-student"><div class="score-seat">${String(x.seat).padStart(2,'0')} 號</div><div class="score-name">${x.name}</div></div><div class="score-number">${x.score}<span>分</span></div></article>`).join('')}catch(e){statusEl.textContent='正在等待系統資料…'}}
load();setInterval(load,5000);</script></body></html>
