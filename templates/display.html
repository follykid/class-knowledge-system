<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班級榮譽榜</title><link rel="stylesheet" href="/static/style.css"></head><body class="display-page"><div class="display-wrap"><header class="display-header"><div><div class="display-title">🏆 504 班榮譽榜</div><div class="display-subtitle">照片・積分・寶物卡</div></div><button class="display-full" onclick="document.documentElement.requestFullscreen?.()">⛶ 全螢幕</button></header><div id="status" class="display-status">資料載入中…</div><main id="board" class="display-grid"></main></div><script>
const board=document.getElementById('board'),statusEl=document.getElementById('status');
function avatar(x){return `/static/avatars/${x.account==='teacher01'?'teacher.jpg':String(x.seat).padStart(2,'0')+'.jpg'}`};
function cardIcon(name){const m={'造型文具':'✏️','限量商品':'🎁','功課減量':'📚','使用電腦':'💻','值日生跳過':'🧹','免睡卡':'😴','點數加倍':'⭐','免罰金牌':'🛡️','V I P':'👑','珍珠奶茶':'🧋','我想跟他坐':'🪑','銘謝惠顧':'😆','禮物卡':'🎫','手工冰淇淋':'🍦'};return m[name]||'🎁'}
async function load(){try{const r=await fetch('/api/display/leaderboard',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'載入失敗');statusEl.textContent='每 5 秒自動更新';board.innerHTML=d.items.map(x=>`<article class="display-card rank-${Math.min(x.rank,4)}"><div class="rank-badge">${x.rank<=3?['🥇','🥈','🥉'][x.rank-1]:x.rank}</div><img class="display-avatar" src="${avatar(x)}" onerror="this.style.visibility='hidden'"><div class="display-info"><div class="display-seat">${String(x.seat).padStart(2,'0')} 號</div><div class="display-name">${x.name}</div><div class="display-score">⭐ ${x.score} <span>分</span></div><div class="display-cards">${x.cards.length?x.cards.map(c=>`<span class="treasure">${cardIcon(c.name)} ${c.name}</span>`).join(''):'<span class="no-card">尚無寶物卡</span>'}</div></div></article>`).join('')}catch(e){statusEl.textContent='正在等待系統資料…'}}load();setInterval(load,5000);</script></body></html>
