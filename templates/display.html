<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>班級大螢幕｜榮譽榜</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="display-page">
<div class="display-shell">
  <header class="display-header">
    <div>
      <div class="display-title">🏆 班級榮譽榜</div>
      <div class="display-subtitle">504 班學習挑戰平台　｜　照片・積分・寶物卡</div>
    </div>
    <div class="display-actions">
      <span id="updated" class="display-updated">更新中…</span>
      <button class="display-btn" onclick="toggleFullscreen()">⛶ 全螢幕</button>
    </div>
  </header>

  <section id="board" class="display-board">
    <div class="display-loading">🏆 正在載入班級榮譽榜…</div>
  </section>
</div>

<script>
const cardIcons={
  '造型文具':'✏️','限量商品':'🎁','功課減量':'📚','使用電腦':'💻','值日生跳過':'🧹',
  '免睡卡':'😴','點數加倍':'⭐','免罰金牌':'🛡️','V I P':'👑','珍珠奶茶':'🧋',
  '我想跟他坐':'🪑','銘謝惠顧':'😢','禮物卡':'🎫','手工冰淇淋':'🍦'
};
function avatar(x){return `/static/avatars/${x.account==='teacher01'?'teacher.jpg':String(x.seat).padStart(2,'0')+'.jpg'}`}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cardHtml(cards){
  if(!cards.length) return '<span class="no-card">尚無寶物卡</span>';
  return cards.map(c=>`<span class="treasure-card" title="${escapeHtml(c.description)}"><span class="treasure-icon">${cardIcons[c.name]||'🎴'}</span><span>${escapeHtml(c.name)}</span></span>`).join('');
}
function rankBadge(rank){return rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank}
function render(items){
  const top=items.slice(0,3), rest=items.slice(3);
  board.innerHTML=`
    <div class="podium">${top.map(x=>`<article class="podium-card p${x.rank}">
      <div class="podium-rank">${rankBadge(x.rank)}</div>
      <img class="display-avatar podium-avatar" src="${avatar(x)}" alt="${escapeHtml(x.name)}">
      <div class="podium-seat">${String(x.seat).padStart(2,'0')} 號</div>
      <div class="podium-name">${escapeHtml(x.name)}</div>
      <div class="podium-score">⭐ ${x.score}<small> 分</small></div>
      <div class="podium-cards">${cardHtml(x.cards)}</div>
    </article>`).join('')}</div>
    <div class="rank-grid">${rest.map(x=>`<article class="rank-card">
      <div class="rank-number">${x.rank}</div>
      <img class="display-avatar rank-avatar" src="${avatar(x)}" alt="${escapeHtml(x.name)}">
      <div class="rank-main">
        <div class="rank-name-row"><span class="rank-seat">${String(x.seat).padStart(2,'0')}號</span><strong>${escapeHtml(x.name)}</strong></div>
        <div class="rank-score">⭐ <b>${x.score}</b> 分</div>
        <div class="rank-treasures">${cardHtml(x.cards)}</div>
      </div>
    </article>`).join('')}</div>`;
}
async function load(){
  try{
    const r=await fetch('/api/display/leaderboard',{cache:'no-store'});
    const d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||'載入失敗');
    render(d.items||[]);
    updated.textContent='最後更新：'+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(e){
    updated.textContent='暫時無法更新';
  }
}
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
load();
setInterval(load,5000);
</script>
</body>
</html>
