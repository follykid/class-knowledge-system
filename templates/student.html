<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學生知識王</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap"><div class="top"><div class="brand">👑 學生知識王</div><div><span id="who" class="pill"></span> <button class="btn secondary" onclick="logout()">登出</button></div></div><div class="two"><div class="grid"><div class="card"><div class="top"><div><div class="muted">我的班級積分</div><div id="score" class="scorebig">0</div></div><div id="hp" class="pill">❤️ 20</div></div><div class="grid grid2"><button class="btn" onclick="startAI()">🤖 AI 練習對戰</button><button class="btn secondary" onclick="createRoom()">🎮 建立真人房間</button></div></div><div class="card"><h2>🎮 真人對戰房間</h2><div id="rooms">載入中…</div></div><div class="card" id="battleCard"><h2>📚 知識王</h2><div id="battle">選擇 AI 對戰或加入房間開始。</div></div></div><div class="card"><h2>🏆 榮譽榜</h2><div id="board"></div></div></div></div><script>
let me=null,game=null,roomCode=null,roomTimer=null;
async function api(url,opt){let r=await fetch(url,opt);let d=await r.json();if(r.status===401){location.href='/';throw Error('login')}if(!r.ok)throw Error(d.error||'錯誤');return d}
async function init(){let d=await api('/api/me');me=d.user;renderMe();loadBoard();loadRooms();setInterval(loadBoard,5000);setInterval(loadRooms,5000)}
function renderMe(){who.textContent=`${me.name}　💰 ${me.score}`;score.textContent=me.score;hp.textContent='❤️ '+me.hp}
async function loadBoard(){let d=await api('/api/leaderboard');board.innerHTML='<table class="leader"><tr><th>#</th><th>頭像</th><th>姓名</th><th>積分</th></tr>'+d.items.map(x=>`<tr class="${x.rank<=3?'rank1':''}"><td>${x.rank}</td><td><img class="avatar" src="/static/avatars/${x.account==='teacher01'?'teacher.jpg':String(x.seat).padStart(2,'0')+'.jpg'}"></td><td>${x.name}${x.account==='teacher01'?' <span class="pill">小明</span>':''}</td><td>${x.score}</td></tr>`).join('')+'</table>'}
async function loadRooms(){let d=await api('/api/rooms');rooms.innerHTML=d.rooms.length?d.rooms.map(r=>`<div class="room"><div><b>桌 ${r.code}</b><div class="muted">${r.players.length}/2 人　${r.players.map(p=>p.name).join('、')}</div></div><button class="btn secondary" onclick="joinRoom('${r.code}')">加入</button></div>`).join(''):'<div class="muted">目前沒有等待中的房間。</div>'}
async function startAI(){let d=await api('/api/questions?count=10');game={mode:'ai',questions:d.questions,index:0,correct:0,answered:false};showQuestion()}
function showQuestion(){let q=game.questions[game.index];battle.innerHTML=`<div class="muted">第 ${game.index+1} / ${game.questions.length} 題</div><div class="question">${q.question}</div><div class="answers">${q.options.map((o,i)=>`<button class="answer" onclick="answerAI(${i+1})">${i+1}. ${o}</button>`).join('')}</div>`}
async function answerAI(choice){if(game.answered)return;game.answered=true;let q=game.questions[game.index];let d=await fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:q.id,choice})});let v=await d.json();if(v.correct)game.correct++;battle.insertAdjacentHTML('beforeend',`<div class="notice ${v.correct?'ok':'err'}">${v.correct?'✅ 答對！':'❌ 答錯'}</div>`);setTimeout(nextAI,550)}
function nextAI(){game.index++;game.answered=false;if(game.index>=game.questions.length)finishAI();else showQuestion()}
async function finishAI(){let win=game.correct>=Math.ceil(game.questions.length*.6);let event='ai:'+crypto.randomUUID();let d=await api('/api/quiz/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_id:event,mode:'ai',correct:game.correct,win})});battle.innerHTML=`<div class="hero">${win?'🎉 勝利！':'💪 再接再厲！'}</div><p>答對 ${game.correct}/${game.questions.length} 題</p><p>本場獲得 <b>+${d.earned}</b> 班級積分</p><button class="btn" onclick="startAI()">再玩一次</button>`;me.score=d.score;renderMe();loadBoard()}
async function createRoom(){let d=await api('/api/rooms',{method:'POST'});roomCode=d.room.code;openRoom();}
async function joinRoom(c){await api('/api/rooms/'+c+'/join',{method:'POST'});roomCode=c;openRoom()}
function openRoom(){clearInterval(roomTimer);roomTimer=setInterval(pollRoom,1200);pollRoom()}
async function pollRoom(){if(!roomCode)return;let d=await api('/api/rooms/'+roomCode);let r=d.room;
if(r.status==='waiting'){battle.innerHTML=`<div class=\"hero\">桌 ${r.code}</div><p>${r.players.length}/2 人：${r.players.map(p=>p.name+'（'+p.correct_count+'題）').join('、')}</p><p class=\"muted\">等待另一位玩家…</p>`;if(r.host_id===me.id)battle.insertAdjacentHTML('beforeend','<button class=\"btn\" onclick=\"startRoom()\">開始對戰</button>');lastReal=-1;return}
if(r.status==='finished'){battle.innerHTML=`<div class=\"hero\">🎉 對戰完成！</div><p>${r.players.map(p=>p.name+'：'+p.correct_count+'題').join('　')}</p><p class=\"ok\">積分已更新。</p>`;clearInterval(roomTimer);loadBoard();return}
if(r.status==='playing'){if(!document.getElementById('realQ'))battle.innerHTML=`<div class=\"hero\">桌 ${r.code}</div><p>${r.players.map(p=>p.name+'（'+p.correct_count+'題）').join('、')}</p><div id=\"realQ\">載入題目…</div>`;loadRealQ(r.current_index);}}
async function startRoom(){await api('/api/rooms/'+roomCode+'/start',{method:'POST'});pollRoom()}
let lastReal=-1;async function loadRealQ(idx){if(lastReal===idx)return;lastReal=idx;let d=await api('/api/rooms/'+roomCode+'/question');if(d.done)return;let q=d.question;realQ.innerHTML=`<div class="muted">第 ${idx+1} 題</div><div class="question">${q.question}</div><div class="answers">${q.options.map((o,i)=>`<button class="answer" onclick="answerReal(${idx},${i+1})">${i+1}. ${o}</button>`).join('')}</div>`}
async function answerReal(idx,choice){let d=await api('/api/rooms/'+roomCode+'/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:idx,choice})});lastReal=-1;pollRoom()}
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/'}init();
</script></body></html>
