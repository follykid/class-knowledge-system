<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學生知識王</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap"><div class="top"><div class="brand">👑 學生知識王</div><div><span id="who" class="pill"></span> <button class="btn secondary" onclick="logout()">登出</button></div></div><div class="two"><div class="grid"><div class="card"><div class="top"><div><div class="muted">我的班級積分</div><div id="score" class="scorebig">0</div></div><div id="hp" class="pill">❤️ HP 100</div></div><div class="grid grid2"><button class="btn" onclick="startGame()">🤖 AI 練習對戰</button><button class="btn secondary" onclick="createRoom()">🎮 建立真人房間</button></div></div><div class="card"><h2>🎁 幸運抽獎</h2><p>每 <b>20</b> 分可以抽一次寶物卡。</p><div class="grid grid2"><button id="drawBtn" class="btn gold" onclick="drawPrize()">🎰 抽一次（20分）</button><button class="btn secondary" onclick="loadPrizes(true)">🎒 我的寶物卡</button></div><div id="drawResult"></div><div id="inventory" class="mt"></div></div><div class="card"><h2>🎮 真人對戰房間</h2><div id="rooms">載入中…</div></div></div><div class="card"><h2>🏆 榮譽榜</h2><div id="board"></div></div></div></div><script>
let me=null;async function api(url,opt){let r=await fetch(url,opt);let d=await r.json();if(r.status===401){location.href='/';throw Error('login')}if(!r.ok)throw Error(d.error||'錯誤');return d}
async function init(){let d=await api('/api/me');me=d.user;renderMe();loadBoard();loadRooms();loadPrizes(false);setInterval(loadBoard,5000);setInterval(loadRooms,5000);setInterval(()=>loadPrizes(false),5000)}function renderMe(){who.textContent=`${me.name}　⭐ ${me.score}`;score.textContent=me.score;hp.textContent='❤️ HP '+me.hp}
async function loadBoard(){let d=await api('/api/leaderboard');board.innerHTML='<table class="leader"><tr><th>#</th><th>頭像</th><th>姓名</th><th>積分</th></tr>'+d.items.map(x=>`<tr class="${x.rank<=3?'rank1':''}"><td>${x.rank}</td><td><img class="avatar" src="/static/avatars/${x.account==='teacher01'?'teacher.jpg':String(x.seat).padStart(2,'0')+'.jpg'}"></td><td>${x.name}${x.account==='teacher01'?' <span class="pill">小明</span>':''}</td><td>${x.score}</td></tr>`).join('')+'</table>'}
async function loadRooms(){let d=await api('/api/rooms');rooms.innerHTML=d.rooms.length?d.rooms.map(r=>`<div class="room"><div><b>桌 ${r.code}</b><div class="muted">${r.players.length}/2 人　${r.players.map(p=>p.name).join('、')}</div></div><button class="btn secondary" onclick="joinRoom('${r.code}')">加入</button></div>`).join(''):'<div class="muted">目前沒有等待中的房間。</div>'}
function startGame(){window.open('/game','knowledgeGame','width=1100,height=820,resizable=yes,scrollbars=yes')}
async function createRoom(){let d=await api('/api/rooms',{method:'POST'});window.open('/game?room='+d.room.code,'knowledgeGame','width=1100,height=820,resizable=yes,scrollbars=yes')}
async function joinRoom(c){await api('/api/rooms/'+c+'/join',{method:'POST'});window.open('/game?room='+c,'knowledgeGame','width=1100,height=820,resizable=yes,scrollbars=yes')}
async function loadPrizes(show){let d=await api('/api/prizes');drawBtn.disabled=me.score<20;let mine=d.owned||[];inventory.innerHTML=mine.length?'<h3>🎒 尚未兌換</h3>'+mine.map(x=>`<div class="prize-item">✨ <b>${x.name}</b><span class="muted">${x.description}</span></div>`).join(''):'<div class="muted">目前沒有待兌換寶物卡。</div>';if(show)inventory.scrollIntoView({behavior:'smooth'})}
async function drawPrize(){if(me.score<20){alert('點數不足 20 分，無法抽獎！');return}drawBtn.disabled=true;drawResult.innerHTML='<div class="hero">🎰 抽獎中…</div>';await new Promise(r=>setTimeout(r,700));let d=await api('/api/prizes/draw',{method:'POST'});me.score=d.score;renderMe();drawResult.innerHTML=d.card.name==='銘謝惠顧'?`<div class="notice err center">😢 ${d.card.name}！扣除 20 分，下次手氣一定更好！</div>`:`<div class="notice ok center">🎉 恭喜抽中 <b>✨ ${d.card.name}</b>！<br><span class="muted">已放入你的寶物卡背包。</span></div>`;loadBoard();loadPrizes(false);}
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/'}init();
</script></body></html>
