<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學生積分系統｜知識王</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap old-home">
<div class="top old-top"><div class="brand">👑 班級積分系統</div><div><span id="who" class="pill"></span> <button class="btn secondary" onclick="logout()">登出</button></div></div>
<div class="profile card"><img id="myAvatar" class="avatar big-avatar"><div><div class="muted">我的資料</div><h2 id="myName">學生</h2><div>座號：<b id="mySeat">--</b></div></div><div class="stats"><div><span>⭐ 班級積分</span><b id="score">0</b> 分</div><div><span>❤️ HP</span><b id="hp">100</b></div></div></div>
<div class="old-columns"><div class="main-column">
<div class="card"><h2>🎮 知識王對戰</h2><p class="muted">答對基本 10 分，回答越快分數越高。</p><div class="grid grid2"><button class="btn big-btn" onclick="startGame()">🤖 AI 對戰</button><button class="btn secondary big-btn" onclick="createRoom()">👥 真人對戰</button></div><div class="rules"><b>對戰規則</b><br>❤️ 開始時 100 HP　｜　❌ 答錯 HP -10<br>🏆 贏 AI：總得分 100% 變成 HP　｜　🤖 輸 AI：50% 變成 HP<br>⭐ 150 HP = 1 分　｜　補充練習：1 分 → 10 HP　｜　AI 難度 65%</div></div>
<div class="card"><h2>🎁 幸運抽獎</h2><p>每 <b>20 分</b>可以抽一次寶物卡。</p><div class="grid grid2"><button id="drawBtn" class="btn gold big-btn" onclick="drawPrize()">🎰 抽一次（20分）</button><button class="btn secondary big-btn" onclick="loadPrizes(true)">🎒 我的寶物卡</button></div><div id="drawResult"></div><div id="inventory" class="mt"></div></div>
<div class="card"><h2>🎮 真人對戰房間</h2><div id="rooms">載入中…</div></div>
</div><div class="side-column"><div class="card"><h2>🏆 榮譽榜</h2><div id="board"></div></div></div></div></div><script>
let me=null;async function api(url,opt){let r=await fetch(url,opt);let d=await r.json();if(r.status===401){location.href='/';throw Error('login')}if(!r.ok)throw Error(d.error||'錯誤');return d}
async function init(){try{let d=await api('/api/me');me=d.user;renderMe();await loadBoard();loadRooms();loadPrizes(false);setInterval(loadBoard,5000);setInterval(loadRooms,5000);setInterval(()=>loadPrizes(false),5000)}catch(e){if(e.message!=='login'){document.body.innerHTML='<div class="wrap"><div class="card center"><h2>系統正在準備中</h2><p class="muted">請稍候幾秒後重新整理。</p><button class="btn" onclick="location.reload()">重新整理</button></div></div>'}}}
function renderMe(){who.textContent=`${me.name}　⭐ ${me.score} 分`;score.textContent=me.score;hp.textContent=me.hp;myName.textContent=me.name;mySeat.textContent=me.seat||'—';myAvatar.src=`/static/avatars/${me.account==='teacher01'?'teacher.jpg':String(me.seat).padStart(2,'0')+'.jpg'}`}
async function loadBoard(){let d=await api('/api/leaderboard');board.innerHTML='<table class="leader old-leader"><tr><th>名次</th><th>頭像</th><th>姓名</th><th>積分</th></tr>'+d.items.map(x=>`<tr class="${x.rank<=3?'rank1':''}"><td>${x.rank}</td><td><img class="avatar" src="/static/avatars/${x.account==='teacher01'?'teacher.jpg':String(x.seat).padStart(2,'0')+'.jpg'}"></td><td>${x.name}${x.account==='teacher01'?' <span class="pill">小明</span>':''}</td><td><b>${x.score}</b></td></tr>`).join('')+'</table>'}
async function loadRooms(){let d=await api('/api/rooms');rooms.innerHTML=d.rooms.length?d.rooms.map(r=>`<div class="room"><div><b>房間 ${r.code}</b><div class="muted">${r.players.length}/2 人　${r.players.map(p=>p.name).join('、')}</div></div><button class="btn secondary" onclick="joinRoom('${r.code}')">加入</button></div>`).join(''):'<div class="muted">目前沒有等待中的房間。</div>'}
function startGame(){window.open('/game','knowledgeGame','width=1100,height=820,resizable=yes,scrollbars=yes')}async function createRoom(){let d=await api('/api/rooms',{method:'POST'});window.open('/game?room='+d.room.code,'knowledgeGame','width=1100,height=820,resizable=yes,scrollbars=yes')}async function joinRoom(c){await api('/api/rooms/'+c+'/join',{method:'POST'});window.open('/game?room='+c,'knowledgeGame','width=1100,height=820,resizable=yes,scrollbars=yes')}
async function loadPrizes(show){let d=await api('/api/prizes');drawBtn.disabled=me.score<20;let mine=d.owned||[];inventory.innerHTML=mine.length?'<h3>🎒 尚未兌換</h3>'+mine.map(x=>`<div class="prize-item">✨ <b>${x.name}</b><span class="muted">${x.description}</span></div>`).join(''):'<div class="muted">目前沒有待兌換寶物卡。</div>';if(show)inventory.scrollIntoView({behavior:'smooth'})}
async function drawPrize(){if(me.score<20){alert('點數不足 20 分，無法抽獎！');return}drawBtn.disabled=true;drawResult.innerHTML='<div class="hero">🎰 抽獎中…</div>';await new Promise(r=>setTimeout(r,700));let d=await api('/api/prizes/draw',{method:'POST'});me.score=d.score;renderMe();drawResult.innerHTML=d.card.name==='銘謝惠顧'?`<div class="notice err center">😢 ${d.card.name}！扣除 20 分，下次手氣一定更好！</div>`:`<div class="notice ok center">🎉 恭喜抽中 <b>✨ ${d.card.name}</b>！<br><span class="muted">已放入你的寶物卡背包。</span></div>`;loadBoard();loadPrizes(false)}async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/'}init();</script></body></html>
