<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>👑 知識王遊戲</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap game-wrap"><div class="top"><div class="brand">👑 知識王</div><div><span id="who" class="pill"></span> <span id="score" class="pill">⭐ 0 分</span> <span id="hp" class="pill">❤️ HP 100</span></div></div><div class="card game-card"><div id="game">載入中…</div></div></div><script>
let me=null,game=null,roomCode=new URLSearchParams(location.search).get('room'),timer=null,lastReal=-1;
async function api(u,o){let r=await fetch(u,o);let d=await r.json();if(r.status===401){location.href='/';throw Error('login')}if(!r.ok)throw Error(d.error||'錯誤');return d}
function renderTop(){who.textContent=me.name;score.textContent='⭐ '+me.score+' 分';hp.textContent='❤️ HP '+me.hp}
async function init(){let d=await api('/api/me');me=d.user;renderTop();if(roomCode)openRoom();else startAI()}
async function startAI(){let d=await api('/api/questions?count=10');game={questions:d.questions,index:0,correct:0,answered:false};me.hp=100;renderTop();showAI()}
function showAI(){let q=game.questions[game.index];document.getElementById('game').innerHTML=`<div class="muted center">第 ${game.index+1} / ${game.questions.length} 題</div><div class="hero">❤️ HP ${me.hp}</div><div class="question game-question">${q.question}</div><div class="answers">${q.options.map((o,i)=>`<button class="answer" onclick="answerAI(${i+1})">${i+1}. ${o}</button>`).join('')}</div><p class="muted center">答錯一次：HP -10</p>`}
async function answerAI(choice){if(game.answered)return;game.answered=true;let q=game.questions[game.index];let v=await api('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:q.id,choice})});me.hp=v.hp;renderTop();document.getElementById('game').insertAdjacentHTML('beforeend',`<div class="notice ${v.correct?'ok':'err'} center">${v.correct?'✅ 答對！':'❌ 答錯！ HP -10'}</div>`);if(v.correct)game.correct++;if(me.hp<=0){setTimeout(()=>needRefill(),700);return}setTimeout(()=>{game.index++;game.answered=false;if(game.index>=game.questions.length)finishAI();else showAI()},650)}
async function needRefill(){let d=confirm('❤️ HP 已經用完了！\n\n是否使用 1 分兌換 10 HP 繼續練習？');if(d){try{let r=await api('/api/hp/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({points:1})});me.score=r.score;me.hp=r.hp;renderTop();game.answered=false;game.index++;if(game.index>=game.questions.length)finishAI();else showAI()}catch(e){alert(e.message);finishAI()}}else finishAI()}
async function finishAI(){let win=game.correct>=6;let d=await api('/api/quiz/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_id:'ai:'+crypto.randomUUID(),mode:'ai',correct:game.correct,win,hp:me.hp})});me.score=d.score;renderTop();document.getElementById('game').innerHTML=`<div class="hero">${win?'🎉 挑戰成功！':'💪 再接再厲！'}</div><p class="center">答對 <b>${game.correct}/${game.questions.length}</b> 題</p><p class="center">結算 HP：<b>❤️ ${me.hp}</b></p><p class="center">本場獲得 <b>+${d.earned} 分</b></p><p class="muted center">換算規則：100 HP = 15 分</p><div class="grid grid2"><button class="btn" onclick="startAI()">🔄 再玩一次</button><button class="btn secondary" onclick="window.close()">關閉遊戲</button></div>`}
function openRoom(){clearInterval(timer);timer=setInterval(pollRoom,1000);pollRoom()}
async function pollRoom(){let d=await api('/api/rooms/'+roomCode);let r=d.room;if(r.status==='waiting'){document.getElementById('game').innerHTML=`<div class="hero">🎮 真人對戰</div><p class="center">房間代碼：<b>${r.code}</b></p><p class="center">${r.players.length}/2 人：${r.players.map(p=>p.name).join('、')}</p>${r.host_id===me.id&&r.players.length>=2?'<button class="btn" onclick="startRoom()">開始對戰</button>':'<p class="muted center">等待另一位玩家加入…</p>'}`;return}if(r.status==='finished'){clearInterval(timer);document.getElementById('game').innerHTML=`<div class="hero">🏆 對戰完成！</div><p class="center">${r.players.map(p=>p.name+'：'+p.correct_count+' 題').join('　')}</p><p class="ok center">積分已依 HP 結算。</p><button class="btn secondary" onclick="window.close()">關閉遊戲</button>`;return}if(r.status==='playing'){if(lastReal!==r.current_index){lastReal=r.current_index;let q=await api('/api/rooms/'+roomCode+'/question');if(q.done)return;document.getElementById('game').innerHTML=`<div class="muted center">第 ${r.current_index+1} / ${r.question_count} 題</div><div class="hero">❤️ HP ${me.hp}</div><div class="question game-question">${q.question.question}</div><div class="answers">${q.question.options.map((o,i)=>`<button class="answer" onclick="answerReal(${r.current_index},${i+1})">${i+1}. ${o}</button>`).join('')}</div><p class="muted center">${r.players.map(p=>p.name+'：'+p.correct_count+' 題').join('　')}</p>`}}}
async function startRoom(){await api('/api/rooms/'+roomCode+'/start',{method:'POST'});pollRoom()}
async function answerReal(idx,choice){await api('/api/rooms/'+roomCode+'/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:idx,choice})});lastReal=-1;pollRoom()}
init();</script></body></html>
