<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師後台</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap"><div class="top"><div class="brand">🔐 教師管理後台</div><button class="btn secondary" onclick="logout()">登出</button></div><div class="card"><h2>📺 大螢幕排名</h2><p class="muted">把全班即時排行榜開到投影機或教室大螢幕。</p><button class="btn" onclick="openDisplay()">📺 開啟大螢幕排名</button></div><div class="card leaderboard-card"><h2>🏆 班級榮譽榜 <span class="muted" style="font-size:.72em;font-weight:400">（3 行 × 9 格）</span></h2><div id="list" class="admin-grid">載入中…</div></div><div class="card question-bank-card"><h2>📚 題庫管理 <span id="qCount" class="muted" style="font-size:.72em;font-weight:400"></span></h2>
<p class="muted">可直接新增題目，或匯入 CSV。匯入後題目會存進 PostgreSQL，Render 重新部署也不會消失。</p>
<div class="question-tools">
  <input id="qSearch" class="input" placeholder="搜尋題目…">
  <select id="qCategory" class="input"><option value="">全部分類</option></select>
  <button class="btn secondary" onclick="loadQuestions()">搜尋</button>
  <label class="btn secondary file-btn">📥 匯入 CSV<input id="csvFile" type="file" accept=".csv,text/csv" onchange="importCSV(this.files[0])"></label>
  <a class="btn secondary" href="/api/admin/questions/export">📤 匯出 CSV</a>
</div>
<details class="question-add"><summary>＋ 手動新增一題</summary>
<div class="add-grid">
  <select id="newType" class="input"><option>選擇題</option><option>是非題</option></select>
  <input id="newCategory" class="input" placeholder="分類，例如：自然1-1">
  <input id="newSeconds" class="input" type="number" min="1" max="600" value="60" placeholder="秒數">
</div>
<textarea id="newQuestion" class="input" rows="2" placeholder="題目"></textarea>
<div id="optionInputs" class="option-grid"></div>
<div class="add-actions"><button class="btn" onclick="addQuestion()">➕ 新增題目</button></div>
</details>
<div id="questionStatus" class="muted"></div>
<div id="questions" class="question-list">載入中…</div>
</div><div class="card"><h2>🎁 寶物卡待核銷</h2><div id="prizes">載入中…</div></div><div class="card"><h2>📊 學生容易錯的題目</h2><div id="errors">載入中…</div></div></div><style>
.leaderboard-card{overflow:hidden}
.admin-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(3,auto);gap:8px;margin-top:10px}
.admin-student{min-width:0;border:1px solid #30343b;border-radius:10px;background:#15181d;padding:8px;box-sizing:border-box}
.student-top{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.student-top b{overflow:hidden;text-overflow:ellipsis;font-size:.98rem}
.seat{color:#8fb7df;font-size:.8rem;flex:0 0 auto}
.account{display:none;color:#777;font-size:.68rem}
.student-stats{display:flex;align-items:center;justify-content:space-between;margin-top:5px;font-size:.75rem;color:#aaa}
.student-stats .score{font-size:1.02rem;font-weight:700;color:#ffeb3b}
.adjust{display:flex;gap:5px;margin-top:6px}
.adjust .btn{flex:1;padding:6px 4px;min-width:0;font-size:.85rem}
.adjust .danger{background:#f45151}
@media (max-width:1100px){.admin-grid{grid-template-columns:repeat(9,minmax(88px,1fr));overflow-x:auto;padding-bottom:4px}.admin-student{min-width:88px}}

.question-tools{display:grid;grid-template-columns:1.5fr 1fr auto auto auto;gap:8px;align-items:center;margin:10px 0}
.input{width:100%;box-sizing:border-box;background:#15181d;color:#eee;border:1px solid #363b44;border-radius:8px;padding:9px 10px;font:inherit}
.file-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.question-add{background:#15181d;border:1px solid #30343b;border-radius:10px;padding:8px 12px;margin:8px 0 10px}
.question-add summary{cursor:pointer;font-weight:700}
.add-grid{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin:10px 0}
#newQuestion{margin-bottom:8px;resize:vertical}
.option-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.add-actions{margin-top:8px}
.question-list{display:grid;gap:7px;max-height:520px;overflow:auto;margin-top:8px}
.question-item{border:1px solid #30343b;border-radius:10px;padding:9px;background:#15181d}
.question-item .q-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.question-item .q-id{color:#8fb7df;font-size:.78rem}
.question-item .q-cat{color:#b7c0cc;font-size:.78rem}
.question-item .q-text{margin-top:5px;line-height:1.4}
.question-item .q-options{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.q-opt{background:#242831;border-radius:7px;padding:4px 7px;font-size:.8rem}
.q-opt.correct{outline:1px solid #ffcc33}
.question-item .q-actions{margin-top:6px;display:flex;justify-content:flex-end}
@media(max-width:900px){.question-tools{grid-template-columns:1fr 1fr}.option-grid{grid-template-columns:1fr 1fr}}
</style><script>async function api(u,o){let r=await fetch(u,o);let d=await r.json();if(r.status===401||r.status===403){location.href='/';throw 0}return d}async function load(){let d=await api('/api/admin/students');list.innerHTML=d.items.map(s=>`<div class="admin-student"><div class="student-top"><span class="seat">${String(s.seat).padStart(2,'0')}</span><b>${s.name}</b><span class="account">${s.account}</span></div><div class="student-stats"><span class="score">⭐ ${s.score}</span><span>${s.wins}/${s.losses}</span></div><div class="adjust"><button class="btn" onclick="adj(${s.id},1)">+1</button><button class="btn danger" onclick="adj(${s.id},-1)">-1</button></div></div>`).join('')}async function loadPrizes(){let d=await api('/api/admin/prizes');prizes.innerHTML=d.items.length?'<table class="leader"><tr><th>座號</th><th>學生</th><th>寶物卡</th><th>抽中時間</th><th>操作</th></tr>'+d.items.map(x=>`<tr><td>${String(x.seat).padStart(2,'0')}</td><td>${x.name}</td><td>✨ <b>${x.card}</b></td><td>${new Date(x.created_at).toLocaleString('zh-TW')}</td><td><button class="btn danger" onclick="redeem(${x.id})">核銷／消卡</button></td></tr>`).join('')+'</table>':'<div class="muted">目前沒有待核銷的寶物卡。</div>'}async function redeem(id){await api('/api/admin/prizes/'+id+'/redeem',{method:'POST'});loadPrizes()}async function loadErrors(){let d=await api('/api/admin/errors');errors.innerHTML=d.items.length?'<table class="leader"><tr><th>科目</th><th>題目</th><th>答錯</th><th>作答</th></tr>'+d.items.map(x=>`<tr><td>${x.category}</td><td>${x.question}</td><td class="err"><b>${x.wrong}</b></td><td>${x.attempts}</td></tr>`).join('')+'</table>':'<div class="muted">目前還沒有錯題資料。</div>'}async function adj(id,d){await api('/api/admin/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:id,delta:d,reason:'教師手動調整'})});load()}function openDisplay(){window.open('/display','classKnowledgeDisplay','width=1280,height=900,resizable=yes,scrollbars=yes')}async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/'}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;',"\"":'&quot;'}[c]))}
function renderOptionInputs(){let ox=document.getElementById('newType').value==='是非題';let box=document.getElementById('optionInputs');if(ox){box.innerHTML='<input class="input" value="O" disabled><input class="input" value="X" disabled><select id="newCorrect" class="input"><option value="1">正確答案：O</option><option value="2">正確答案：X</option></select>';return}box.innerHTML=['1','2','3','4'].map(i=>`<input class="input" id="opt${i}" placeholder="選項${i}">`).join('')+'<select id="newCorrect" class="input"><option value="1">正確答案：1</option><option value="2">正確答案：2</option><option value="3">正確答案：3</option><option value="4">正確答案：4</option></select>'}
newType.addEventListener('change',renderOptionInputs);renderOptionInputs();
async function loadQuestions(){let qs=new URLSearchParams();if(qSearch.value.trim())qs.set('q',qSearch.value.trim());if(qCategory.value)qs.set('category',qCategory.value);let d=await api('/api/admin/questions?'+qs.toString());qCount.textContent=`（目前 ${d.count} 題）`;let selected=qCategory.value;qCategory.innerHTML='<option value="">全部分類</option>'+d.categories.map(c=>`<option>${esc(c)}</option>`).join('');qCategory.value=selected;questions.innerHTML=d.items.length?d.items.map(x=>{let opts=x.options.map((o,i)=>`<span class="q-opt ${x.correct===i+1?'correct':''}">${i+1}. ${esc(o)}</span>`).join('');return `<div class="question-item"><div class="q-head"><span class="q-id">#${x.id}</span><b>${esc(x.qtype)}</b><span class="q-cat">${esc(x.category)} · ${x.seconds}秒</span></div><div class="q-text">${esc(x.question)}</div><div class="q-options">${opts}</div><div class="q-actions"><button class="btn danger" onclick="deleteQuestion(${x.id})">刪除</button></div></div>`}).join(''):'<div class="muted">沒有符合條件的題目。</div>'}
async function addQuestion(){let type=newType.value;let payload={qtype:type,category:newCategory.value.trim()||'未分類',seconds:Number(newSeconds.value)||60,question:newQuestion.value.trim(),correct:Number(newCorrect.value)||1};if(type==='是非題'){payload.options=['O','X']}else{payload.options=['1','2','3','4'].map(i=>document.getElementById('opt'+i).value.trim())}try{let d=await api('/api/admin/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});questionStatus.textContent=`✅ 已新增第 ${d.question.id} 題`;newQuestion.value='';if(type==='選擇題')['1','2','3','4'].forEach(i=>document.getElementById('opt'+i).value='');await loadQuestions()}catch(e){alert(e.message)}}
async function deleteQuestion(id){if(!confirm('確定要刪除這題嗎？刪除後不會再抽到，但歷史作答紀錄仍保留。'))return;await api('/api/admin/questions/'+id,{method:'DELETE'});loadQuestions()}
async function importCSV(file){if(!file)return;questionStatus.textContent='⏳ 正在匯入…';let fd=new FormData();fd.append('file',file);try{let d=await api('/api/admin/questions/import',{method:'POST',body:fd});questionStatus.textContent=`✅ 匯入 ${d.imported} 題；跳過 ${d.skipped} 題；目前共 ${d.total} 題`+(d.errors?.length?`；有 ${d.errors.length} 列格式問題`:'');if(d.errors?.length)console.warn(d.errors);await loadQuestions()}catch(e){questionStatus.textContent='❌ 匯入失敗';alert(e.message)}csvFile.value=''}
qSearch.addEventListener('keydown',e=>{if(e.key==='Enter')loadQuestions()});loadQuestions();
load();loadPrizes();loadErrors();setInterval(()=>{load();loadPrizes();loadErrors()},5000)</script></body></html>
