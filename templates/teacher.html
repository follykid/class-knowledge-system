<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師後台</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap"><div class="top"><div class="brand">🔐 教師管理後台</div><button class="btn secondary" onclick="logout()">登出</button></div><div class="card"><h2>🏆 班級榮譽榜</h2><div id="list">載入中…</div></div><div class="card"><h2>🎁 寶物卡待核銷</h2><div id="prizes">載入中…</div></div><div class="card"><h2>📊 學生容易錯的題目</h2><div id="errors">載入中…</div></div></div><script>async function api(u,o){let r=await fetch(u,o);let d=await r.json();if(r.status===401||r.status===403){location.href='/';throw 0}return d}async function load(){let d=await api('/api/admin/students');list.innerHTML='<table class="leader"><tr><th>座號</th><th>姓名</th><th>學號</th><th>積分</th><th>勝/負</th><th>調整</th></tr>'+d.items.map(s=>`<tr><td>${String(s.seat).padStart(2,'0')}</td><td>${s.name}</td><td>${s.account}</td><td><b>${s.score}</b></td><td>${s.wins}/${s.losses}</td><td><button class="btn" onclick="adj(${s.id},1)">+1</button> <button class="btn danger" onclick="adj(${s.id},-1)">-1</button></td></tr>`).join('')+'</table>'}async function loadPrizes(){let d=await api('/api/admin/prizes');prizes.innerHTML=d.items.length?'<table class="leader"><tr><th>座號</th><th>學生</th><th>寶物卡</th><th>抽中時間</th><th>操作</th></tr>'+d.items.map(x=>`<tr><td>${String(x.seat).padStart(2,'0')}</td><td>${x.name}</td><td>✨ <b>${x.card}</b></td><td>${new Date(x.created_at).toLocaleString('zh-TW')}</td><td><button class="btn danger" onclick="redeem(${x.id})">核銷／消卡</button></td></tr>`).join('')+'</table>':'<div class="muted">目前沒有待核銷的寶物卡。</div>'}async function redeem(id){await api('/api/admin/prizes/'+id+'/redeem',{method:'POST'});loadPrizes()}async function loadErrors(){let d=await api('/api/admin/errors');errors.innerHTML=d.items.length?'<table class="leader"><tr><th>科目</th><th>題目</th><th>答錯</th><th>作答</th></tr>'+d.items.map(x=>`<tr><td>${x.category}</td><td>${x.question}</td><td class="err"><b>${x.wrong}</b></td><td>${x.attempts}</td></tr>`).join('')+'</table>':'<div class="muted">目前還沒有錯題資料。</div>'}async function adj(id,d){await api('/api/admin/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:id,delta:d,reason:'教師手動調整'})});load()}async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/'}load();loadPrizes();loadErrors();setInterval(()=>{load();loadPrizes();loadErrors()},5000)</script></body></html>
