<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師後台</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap"><div class="top"><div class="brand">🔐 教師管理後台</div><button class="btn secondary" onclick="logout()">登出</button></div><div class="card"><h2>📺 大螢幕排名</h2><p class="muted">把全班即時排行榜開到投影機或教室大螢幕。</p><button class="btn" onclick="openDisplay()">📺 開啟大螢幕排名</button></div><div class="card leaderboard-card"><h2>🏆 班級榮譽榜 <span class="muted" style="font-size:.72em;font-weight:400">（3 行 × 9 格）</span></h2><div id="list" class="admin-grid">載入中…</div></div><div class="card"><h2>🎁 寶物卡待核銷</h2><div id="prizes">載入中…</div></div><div class="card"><h2>📊 學生容易錯的題目</h2><div id="errors">載入中…</div></div></div><style>
.leaderboard-card{overflow:hidden}
.admin-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(3,auto);gap:8px;margin-top:10px}
.admin-student{min-width:0;border:1px solid #30343b;border-radius:10px;background:#15181d;padding:8px;box-sizing:border-box}
.student-top{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.student-top b{overflow:hidden;text-overflow:ellipsis;font-size:.98rem}
.seat{color:#8fb7df;font-size:.8rem;flex:0 0 auto}
.account{display:none;color:#777;font-size:.68rem}
.student-stats{display:flex;align-items:center;justify-content:space-between;margin-top:5px;font-size:.75rem;color:#aaa}
.student-stats .score{font-size:1.02rem;font-weight:700;color:#ffeb3b}
.adjust{display:flex;gap:5px;margin-top:6px}
.adjust .btn{flex:1;padding:6px 4px;min-width:0;font-size:.85rem}
.adjust .danger{background:#f45151}
@media (max-width:1100px){.admin-grid{grid-template-columns:repeat(9,minmax(88px,1fr));overflow-x:auto;padding-bottom:4px}.admin-student{min-width:88px}}
</style><script>async function api(u,o){let r=await fetch(u,o);let d=await r.json();if(r.status===401||r.status===403){location.href='/';throw 0}return d}async function load(){let d=await api('/api/admin/students');list.innerHTML=d.items.map(s=>`<div class="admin-student"><div class="student-top"><span class="seat">${String(s.seat).padStart(2,'0')}</span><b>${s.name}</b><span class="account">${s.account}</span></div><div class="student-stats"><span class="score">⭐ ${s.score}</span><span>${s.wins}/${s.losses}</span></div><div class="adjust"><button class="btn" onclick="adj(${s.id},1)">+1</button><button class="btn danger" onclick="adj(${s.id},-1)">-1</button></div></div>`).join('')}async function loadPrizes(){let d=await api('/api/admin/prizes');prizes.innerHTML=d.items.length?'<table class="leader"><tr><th>座號</th><th>學生</th><th>寶物卡</th><th>抽中時間</th><th>操作</th></tr>'+d.items.map(x=>`<tr><td>${String(x.seat).padStart(2,'0')}</td><td>${x.name}</td><td>✨ <b>${x.card}</b></td><td>${new Date(x.created_at).toLocaleString('zh-TW')}</td><td><button class="btn danger" onclick="redeem(${x.id})">核銷／消卡</button></td></tr>`).join('')+'</table>':'<div class="muted">目前沒有待核銷的寶物卡。</div>'}async function redeem(id){await api('/api/admin/prizes/'+id+'/redeem',{method:'POST'});loadPrizes()}async function loadErrors(){let d=await api('/api/admin/errors');errors.innerHTML=d.items.length?'<table class="leader"><tr><th>科目</th><th>題目</th><th>答錯</th><th>作答</th></tr>'+d.items.map(x=>`<tr><td>${x.category}</td><td>${x.question}</td><td class="err"><b>${x.wrong}</b></td><td>${x.attempts}</td></tr>`).join('')+'</table>':'<div class="muted">目前還沒有錯題資料。</div>'}async function adj(id,d){await api('/api/admin/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:id,delta:d,reason:'教師手動調整'})});load()}function openDisplay(){window.open('/display','classKnowledgeDisplay','width=1280,height=900,resizable=yes,scrollbars=yes')}async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/'}load();loadPrizes();loadErrors();setInterval(()=>{load();loadPrizes();loadErrors()},5000)</script></body></html>
