<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數學算式出牌遊戲</title>
<style>
:root{--teal:#0d9b8e;--ink:#292b31;--bg:#f3faf8;--line:#e1e3e6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.page{max-width:560px;margin:auto;min-height:100vh;padding:14px 18px 26px;display:flex;flex-direction:column;gap:18px}.top{background:white;border:2px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 #e5e8e7}.small{font-size:12px;color:#777}.hp{font-size:22px;font-weight:800;color:var(--teal)}.mode{font-weight:800;color:#777}.rules{text-align:right}.target{margin-top:8px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;text-align:center;box-shadow:0 4px 0 #e5e8e7}.target strong{display:block;font-size:42px;color:var(--teal)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 0}.cardnum{background:#fff;border:2px solid var(--line);border-radius:17px;min-height:100px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;box-shadow:0 5px 0 #e0e4e3}.expr{width:100%;border:2px solid var(--line);border-radius:16px;padding:17px 14px;font:inherit;font-size:17px;box-shadow:0 4px 0 #e5e8e7;outline-color:var(--teal)}.ops{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.ops button{border:2px solid var(--line);border-radius:50%;background:#fff;height:52px;font-size:23px;box-shadow:0 4px 0 #e0e4e3}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{border:2px solid var(--line);background:white;border-radius:12px;padding:11px;font-size:16px;color:#666}.primary{width:100%;background:var(--teal);color:white;border:0;border-radius:15px;padding:15px;font-size:19px;font-weight:800;box-shadow:0 4px 0 #08776d}.message{min-height:44px;text-align:center;font-weight:700;padding:8px}.muted{text-align:center;color:#888;font-size:13px}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:380px){.page{padding:10px}.cardnum{min-height:80px}.ops{gap:5px}.ops button{height:44px}}
</style></head><body><main class="page">
<header class="top"><div><div class="small">❤️ 目前 HP</div><div id="hp" class="hp">載入中</div></div><div class="mode">數學算式出牌</div><div class="rules"><a href="#rules">📖 規則</a></div></header>
<section class="target"><div class="small">🎯 本局目標數字</div><strong id="target">--</strong><div class="small">用下方數字牌與四則運算達成目標</div></section>
<section><div class="cards" id="cards"><div class="cardnum">?</div><div class="cardnum">?</div><div class="cardnum">?</div><div class="cardnum">?</div></div></section>
<section><input id="expression" class="expr" placeholder="點選數字和符號組成算式…" autocomplete="off"></section>
<section class="ops"><button onclick="add(' + ')">＋</button><button onclick="add(' - ')">－</button><button onclick="add(' * ')">×</button><button onclick="add(' / ')">÷</button><button onclick="add('(')">(</button><button onclick="add(')')">)</button></section>
<section class="actions"><button onclick="undo()">↶ 復原</button><button onclick="backspace()">← 刪除</button><button onclick="clearExpr()">清空</button></section>
<div><button id="submit" class="primary" onclick="submitExpr()">出牌</button><button class="primary" style="margin-top:10px;background:#fff;color:var(--teal);border:2px solid var(--teal);box-shadow:none" onclick="newRound()">跳過換牌／新一局</button></div>
<div id="message" class="message" role="status"></div><div id="rules" class="muted">規則：目標數字每局不同。使用桌面上的數字牌，每張最多一次，可搭配 +、−、×、÷ 和括號。答對獲得 20 HP，不增加班級積分。每局成功後請開新一局。</div>
<div class="muted"><a href="/student">返回學生首頁</a></div></main>
<script>
const $=id=>document.getElementById(id);let history=[];let round=null;
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'發生錯誤');return d}
function render(r){round=r;$('target').textContent=r.target;$('cards').innerHTML=r.cards.map((n,i)=>`<button class="cardnum" onclick="addCard(${i})" ${r.solved?'disabled':''}>${n}</button>`).join('');$('submit').disabled=!!r.solved;$('expression').disabled=!!r.solved;}
function add(s){if($('expression').disabled)return;history.push($('expression').value);$('expression').value+=s;$('expression').focus()}
function addCard(i){add(String(round.cards[i]))}
function undo(){if(history.length)$('expression').value=history.pop();else $('expression').value=$('expression').value.slice(0,-1)}function backspace(){ $('expression').value=$('expression').value.slice(0,-1)}function clearExpr(){history=[];$('expression').value=''}
async function newRound(){try{const d=await api('/api/math-cards/new',{});render(d.round);clearExpr();$('message').textContent='新的一局開始！試著達成目標數字。'}catch(e){$('message').textContent=e.message}}
async function submitExpr(){try{const d=await api('/api/math-cards/submit',{expression:$('expression').value});$('hp').textContent=d.hp;$('message').textContent='🎉 '+d.message;round.solved=true;render(round);$('expression').disabled=true}catch(e){$('message').textContent=e.message}}
(async()=>{try{const d=await api('/api/math-cards/state');$('hp').textContent=d.user.hp+' HP';if(d.round){render(d.round);if(d.round.solved)$('message').textContent='本局已完成，請開始新一局。'}else await newRound()}catch(e){$('message').textContent=e.message;setTimeout(()=>location.href='/',1500)}})();
</script></body></html>
