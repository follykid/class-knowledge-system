<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班級潔牙</title><link rel="stylesheet" href="/static/style.css"></head><body class="display-page display-toothbrush-page"><div class="display-wrap"><header class="display-header"><div><div class="display-title">🪥 504 班潔牙</div><div class="display-subtitle">每列 6 人・完成潔牙即可獲得 1 分</div></div><div class="display-actions"><button class="display-nav" onclick="location.href='/display'">🏆 積分排名</button><button class="display-full" onclick="document.documentElement.requestFullscreen?.()">⛶ 全螢幕</button></div></header><div id="status" class="display-status">資料載入中…</div><main id="board" class="display-toothbrush-grid"></main></div><script>
const board=document.getElementById('board'),statusEl=document.getElementById('status');
function avatar(x){return `/static/avatars/${x.account==='teacher01'?'teacher.jpg':String(x.seat).padStart(2,'0')+'.jpg'}`}
async function load(){try{const r=await fetch('/api/display/leaderboard',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'載入失敗');statusEl.textContent='每 5 秒自動更新';board.innerHTML=d.items.map(x=>`<article class="tooth-card"><div class="tooth-top"><div class="tooth-rank">${String(x.seat).padStart(2,'0')}</div><img class="tooth-avatar" src="${avatar(x)}" onerror="this.style.visibility='hidden'"><div><div class="tooth-name">${x.name}</div><div class="tooth-score">目前 ${x.score} 分</div></div></div><button class="toothbrush-btn" ${x.toothbrush_claimed_today?'disabled':''} onclick="claimToothbrush(${x.id},this)">${x.toothbrush_claimed_today?'✓ 今日已完成潔牙':'🪥 完成潔牙＋1 分'}</button><div class="toothbrush-note" id="toothbrush-note-${x.id}"></div></article>`).join('')}catch(e){statusEl.textContent='正在等待系統資料…'}}
async function claimToothbrush(studentId,button){button.disabled=true;button.textContent='處理中…';try{const r=await fetch(`/api/display/toothbrush/${studentId}`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();if(!r.ok){button.textContent=d.already_claimed?'✓ 今日已完成潔牙':'🪥 完成潔牙＋1 分';document.getElementById(`toothbrush-note-${studentId}`).textContent=d.error||'操作失敗';if(!d.already_claimed)button.disabled=false;return;}document.getElementById(`toothbrush-note-${studentId}`).textContent='潔牙成功，積分 +1';button.textContent='✓ 今日已完成潔牙';await load();}catch(e){button.disabled=false;button.textContent='🪥 完成潔牙＋1 分';document.getElementById(`toothbrush-note-${studentId}`).textContent='連線失敗，請再試一次'}}
load();setInterval(load,5000);</script></body></html>
