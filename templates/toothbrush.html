<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>504 潔牙統計</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#10151a;color:#fff}body{overflow:hidden}.wrap{height:100vh;padding:18px 26px;display:flex;flex-direction:column;background:linear-gradient(160deg,#17231f,#0e1417)}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:clamp(28px,2.6vw,44px);font-weight:1000}.sub{color:#aeb9b4;margin-top:3px;font-size:14px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#303b38;color:#fff;font-weight:900;cursor:pointer}.status{text-align:right;color:#84918c;font-size:12px;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:9px;flex:1;min-height:0;overflow:hidden}.item{min-width:0;min-height:0;border:1px solid #34413c;border-radius:13px;background:#1b2521;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:8px}.head{display:flex;align-items:center;gap:9px;min-width:0}.avatar{width:42px!important;height:42px!important;min-width:42px!important;max-width:42px!important;border-radius:50%;object-fit:cover;border:2px solid #52655d}.seat{font-size:11px;color:#89958f}.name{font-size:18px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:11px;color:#8d9993}.action{width:100%;border:0;border-radius:9px;padding:9px 6px;font-size:14px;font-weight:1000;cursor:pointer;background:#d9f7e6;color:#155c36}.action.done{background:#34413c;color:#aab6b0}.note{text-align:center;min-height:13px;font-size:11px;color:#8b9891}@media(max-width:1000px){body{overflow:auto}.wrap{height:auto;min-height:100vh}.grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:120px}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="wrap"><header><div><div class="title">🪥 504 班潔牙統計</div><div class="sub">今天完成就按一下，功能優先、快速登記</div></div><div class="actions"><button class="btn" onclick="location.href='/display'">🏆 排名</button><button class="btn" onclick="document.documentElement.requestFullscreen?.()">⛶ 全螢幕</button></div></header><div id="status" class="status">資料載入中…</div><main id="board" class="grid"></main></div>
<script>const board=document.getElementById('board'),statusEl=document.getElementById('status');let data=[];function avatar(x){return `/static/avatars/${String(x.seat).padStart(2,'0')}.jpg`}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){board.innerHTML=data.map(x=>`<article class="item"><div class="head"><img class="avatar" src="${avatar(x)}" onerror="this.style.display='none'"><div><div class="seat">${String(x.seat).padStart(2,'0')} 號</div><div class="name">${esc(x.name)}</div><div class="score">目前積分 ${x.score} 分</div></div></div><button class="action ${x.toothbrush_claimed_today?'done':''}" ${x.toothbrush_claimed_today?'disabled':''} onclick="claim(${x.id},this)">${x.toothbrush_claimed_today?'✓ 今日已完成':'🪥 完成潔牙＋1 分'}</button><div class="note" id="n${x.id}"></div></article>`).join('')}async function load(){try{const r=await fetch('/api/display/leaderboard',{cache:'no-store'});const d=await r.json();data=d.items||[];statusEl.textContent='每 5 秒更新　｜　共 '+data.length+' 位學生';render()}catch(e){statusEl.textContent='資料載入失敗'}}async function claim(id,b){b.disabled=true;b.textContent='處理中…';try{const r=await fetch('/api/display/toothbrush/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();if(!r.ok){b.textContent=d.already_claimed?'✓ 今日已完成':'🪥 完成潔牙＋1 分';document.getElementById('n'+id).textContent=d.error||'操作失敗';if(!d.already_claimed)b.disabled=false;return}document.getElementById('n'+id).textContent='已登記，積分 +1';await load()}catch(e){b.disabled=false;b.textContent='🪥 完成潔牙＋1 分';document.getElementById('n'+id).textContent='連線失敗'}}load();setInterval(load,5000)</script></body></html>
