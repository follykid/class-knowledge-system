<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班級知識王積分系統 v1</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap"><div class="card login"><h1>🏆 班級知識王</h1><p class="muted" style="text-align:center">全新獨立系統 v1</p><div id="msg"></div><label>帳號</label><input id="account" class="field" placeholder="學號 / teacher / teacher01"><label>密碼</label><input id="password" class="field" type="password" placeholder="四碼密碼"><button class="btn" style="width:100%" onclick="login()">登入</button><p class="muted" style="font-size:13px">教師：teacher / 1930　｜　小明：teacher01 / 1930</p></div></div><script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:account.value,password:password.value})});let d=await r.json();if(!r.ok){msg.innerHTML='<div class="notice err">'+d.error+'</div>';return}location.href=d.user.role==='teacher'?'/teacher':'/student'}</script></body></html>
